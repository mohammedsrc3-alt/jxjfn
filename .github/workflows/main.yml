
name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Essentials
        shell: pwsh
        run: |
          $url = "YOUR_VERIFIED_DOWNLOAD_URL"
          Invoke-WebRequest -Uri $url -OutFile "Downloads.bat" -ErrorAction Stop

          if (!(Test-Path ".\Downloads.bat")) {
            throw "Downloads.bat not found"
          }

      - name: Install Essentials
        shell: cmd
        run: |
          call Downloads.bat
          if errorlevel 1 exit /b 1

      - name: Check AnyDesk Startup Script
        shell: pwsh
        run: |
          if (!(Test-Path ".\start.bat")) {
            throw "start.bat not found. Check the installation script."
          }

          Write-Host "Startup script found."

      - name: Start AnyDesk
        shell: cmd
        run: |
          call start.bat
          if errorlevel 1 exit /b 1

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item ".\Downloads.bat" -Force -ErrorAction SilentlyContinue
